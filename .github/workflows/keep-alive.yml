name: Keep backend awake

on:
  schedule:
    # Render free instances sleep after ~15 minutes without traffic.
    # Five-minute pings keep live mode running when no dashboard is open.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 90 \
            https://sfbackend-9nsb.onrender.com/api/health > /dev/null
